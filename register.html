<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Register - Local Service Finder</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>


    <!-- Navigation -->

    <header class="navbar">

        <div class="logo">

            <span>LSF</span>

            Local Service Finder

        </div>


        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="services.html">
                Services
            </a>

            <a href="#">
                About
            </a>

            <a href="#">
                Contact
            </a>

            <a href="login.html"
               class="login-btn">
                Login
            </a>

        </nav>

    </header>



    <!-- Registration -->

    <section class="auth-section">

        <div class="register-card">

            <div class="auth-header">

                <div class="auth-logo">
                    LSF
                </div>

                <h1>Create Account</h1>

                <p>
                    Join Local Service Finder today
                </p>

            </div>



            <form onsubmit="registerUser(event)">


                <!-- Account Type -->

                <div class="form-group">

                    <label>
                        Register As
                    </label>

                    <select id="userType" required>

                        <option value="">
                            Select account type
                        </option>

                        <option value="customer">
                            Customer
                        </option>

                        <option value="provider">
                            Service Provider
                        </option>

                    </select>

                </div>



                <!-- Full Name -->

                <div class="form-group">

                    <label>
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="registerName"
                        placeholder="Enter your full name"
                        required>

                </div>



                <!-- Email -->

                <div class="form-group">

                    <label>
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="registerEmail"
                        placeholder="Enter your email"
                        required>

                </div>



                <!-- Phone -->

                <div class="form-group">

                    <label>
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="registerPhone"
                        placeholder="Enter your phone number"
                        required>

                </div>



                <!-- Location -->

                <div class="form-group">

                    <label>
                        Location
                    </label>

                    <input
                        type="text"
                        id="registerLocation"
                        placeholder="Enter your location"
                        required>

                </div>



                <!-- Password -->

                <div class="form-group">

                    <label>
                        Password
                    </label>

                    <input
                        type="password"
                        id="registerPassword"
                        placeholder="Create a password"
                        required>

                </div>



                <!-- Confirm Password -->

                <div class="form-group">

                    <label>
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        required>

                </div>



                <button
                    type="submit"
                    class="auth-btn">

                    Create Account

                </button>

            </form>



            <p class="register-text">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>

        </div>

    </section>



    <!-- Footer -->

    <footer>

        <div class="copyright">

            © 2026 Local Service Finder.
            All Rights Reserved.

        </div>

    </footer>



    <script src="js/script.js"></script>

</body>

</html>
