<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Forgot Password - Local Service Finder</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>


    <!-- Navigation -->

    <header class="navbar">

        <div class="logo">

            <span>LSF</span>

            Local Service Finder

        </div>


        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="services.html">
                Services
            </a>

            <a href="#">
                About
            </a>

            <a href="#">
                Contact
            </a>

            <a href="login.html" class="active">
                Login
            </a>

        </nav>

    </header>



    <!-- Forgot Password -->

    <section class="auth-section">

        <div class="auth-card">


            <div class="auth-header">

                <div class="auth-logo">
                    LSF
                </div>

                <h1>
                    Forgot Password?
                </h1>

                <p>
                    Enter your registered email address
                    to reset your password.
                </p>

            </div>



            <form onsubmit="forgotPassword(event)">


                <div class="form-group">

                    <label>
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="forgotEmail"
                        placeholder="Enter your registered email"
                        required>

                </div>



                <button
                    type="submit"
                    class="auth-btn">

                    Send Reset Link

                </button>


            </form>



            <p class="register-text">

                Remember your password?

                <a href="login.html">
                    Back to Login
                </a>

            </p>


        </div>

    </section>



    <!-- Footer -->

    <footer>

        <div class="copyright">

            © 2026 Local Service Finder.
            All Rights Reserved.

        </div>

    </footer>



    <script src="js/script.js"></script>

</body>

</html>
